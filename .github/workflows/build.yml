name: Build and Publish Cloudstream Extension

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Pre-fetch and warm JitPack cache
        run: |
          echo "Warming up JitPack artifacts for recloudstream..."
          curl -s -m 15 https://jitpack.io/api/builds/com.github.recloudstream/gradle > /dev/null 2>&1 || true
          curl -s -m 15 https://jitpack.io/api/builds/com.github.recloudstream/cloudstream > /dev/null 2>&1 || true

      - name: Build Cloudstream Plugin and Repository
        run: |
          if [ -f "./gradlew" ] && [ -s "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew make makePluginsJson --stacktrace || (echo "Retrying Gradle build..." && sleep 5 && ./gradlew make makePluginsJson --stacktrace)
          else
            gradle make makePluginsJson --stacktrace || (echo "Retrying Gradle build..." && sleep 5 && gradle make makePluginsJson --stacktrace)
          fi

      - name: Deploy plugins.json and .cs3 to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: builds
          force_orphan: true
