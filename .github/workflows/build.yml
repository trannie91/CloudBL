name: Build and Publish Cloudstream Extension

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Warm up JitPack Cache
        run: |
          echo "Triggering JitPack builds..."
          curl -s -m 20 https://jitpack.io/api/builds/com.github.recloudstream/gradle > /dev/null 2>&1 || true
          curl -s -m 20 https://jitpack.io/api/builds/com.github.recloudstream/cloudstream > /dev/null 2>&1 || true

      - name: Build Cloudstream Plugin and Repository
        run: |
          if [ -f "./gradlew" ] && [ -s "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew make makePluginsJson --refresh-dependencies --no-daemon --stacktrace || (
              echo "Retrying after waiting for JitPack build to finish..."
              sleep 15
              ./gradlew make makePluginsJson --refresh-dependencies --no-daemon --stacktrace
            )
          else
            gradle make makePluginsJson --refresh-dependencies --no-daemon --stacktrace || (
              echo "Retrying after waiting for JitPack build to finish..."
              sleep 15
              gradle make makePluginsJson --refresh-dependencies --no-daemon --stacktrace
            )
          fi

      - name: Collect all .cs3 plugins and metadata to build folder
        run: |
          mkdir -p ./build
          # Thu thập tất cả file .cs3 được tạo ra vào ./build
          find . -type f -name "*.cs3" -not -path "*/.gradle/*" -exec cp -vf {} ./build/ ;
          # Đảm bảo file plugins.json nằm trong ./build
          find . -type f -name "plugins.json" -not -path "./build/plugins.json" -not -path "*/.gradle/*" -exec cp -vf {} ./build/ ;
          echo "--- Danh sách file trong ./build sẵn sàng xuất bản ---"
          ls -lah ./build

      - name: Upload Artifacts (Cho phép tải trực tiếp file .cs3 từ GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Cloudstream-BLVietsub-Extension
          path: ./build/
          if-no-files-found: warn

      - name: Deploy plugins.json and .cs3 to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: builds
          force_orphan: true
